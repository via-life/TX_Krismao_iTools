<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Excel 图片转 URL · iTools</title>
<link rel="stylesheet" href="css/styles.css" />
<script src="js/lib/jszip.min.js"></script>
</head>
<body>
<div class="tool-page">
  <div class="aurora"></div>
  <nav class="topnav">
    <a class="topnav__back" href="index.html">← 返回</a>
    <div class="topnav__logo">iT</div>
    <span class="topnav__title">Excel 图片转 URL</span>
    <span class="topnav__tag">需求一 · 表格瘦身</span>
  </nav>

  <div class="tool-body">
    <div class="section">
      <div class="section__title"><span class="section__step">1</span>上传文件</div>
      <div class="status" id="service-notice" hidden></div>
      <div class="dropzone glass" id="dropzone">
        <div class="dropzone__icon">🖼️</div>
        <div class="dropzone__title">将 .xlsx 拖到此处，或点击选择</div>
        <div class="dropzone__desc">在浏览器本地解压 xlsx，按图片锚点提取每张嵌入图及其所在单元格，再通过本地服务上传转链接、写回表格瘦身</div>
        <button class="btn btn--primary" id="pick-btn" type="button">选择文件</button>
        <input id="file-input" type="file" accept=".xlsx" hidden />
        <div class="dropzone__file" id="file-name" hidden></div>
      </div>
      <div class="status" id="status" hidden></div>
    </div>

    <div class="section" id="upload-section" hidden>
      <div class="section__title"><span class="section__step">2</span>选择环境并上传</div>
      <div class="card">
        <div class="field">
          <label class="field__label">上传环境</label>
          <div class="actions">
            <label class="switch-row"><input type="radio" name="env" value="test" checked /> 测试环境（默认）</label>
            <label class="switch-row"><input type="radio" name="env" value="prod" /> 正式环境</label>
          </div>
        </div>
        <div class="status" id="env-hint">正在检测本地上传服务…</div>
        <div class="actions" style="margin-top:14px">
          <label class="switch-row"><input type="checkbox" id="norm-header" checked /> 规范化表头（image_0→图1 等）</label>
        </div>
        <div class="actions" style="margin-top:16px">
          <button class="btn btn--primary" id="do-upload" disabled>开始上传图片</button>
          <button class="btn btn--ghost" id="dl-mapping" disabled>下载 单元格→URL 映射 (csv)</button>
          <button class="btn btn--ghost" id="dl-xlsx" disabled>下载 _with_urls.xlsx</button>
        </div>
        <div class="status" id="up-status" hidden></div>
      </div>
    </div>
  </div>
</div>

<div class="drop-overlay" id="drop-overlay" hidden>
  <div class="drop-overlay__inner"><div class="drop-overlay__icon">📥</div><div class="drop-overlay__text">松开导入文件</div></div>
</div>

<script src="js/common.js"></script>
<script src="js/tool1.js"></script>
</body>
</html>
